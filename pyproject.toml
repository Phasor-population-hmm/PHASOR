[project]
name = "phasor"
version = "0.1.0"
description = "Population HMM analysis of stimulus-locked retinal MEA recordings, with a local website."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2.0",
  "pandas>=1.5,<2.3",
  "scipy>=1.10,<1.13",
  "matplotlib>=3.7,<3.9",
  "scikit-learn>=1.3,<1.5",
  "umap-learn",
  "h5py",
  "networkx>=3.1,<3.3",
  "openpyxl>=3.1",
  "seaborn>=0.12,<0.14",
]

[tool.setuptools]
packages = [
  "phasor_pipeline",
  "mode_project",
  "mode_project.analysis",
  "mode_project.data_processing",
  "mode_project.hmm_pkg",
  "mode_project.retina_match",
  "mode_project.viz",
]
include-package-data = true

[tool.setuptools.package-data]
phasor_pipeline = ["**/*.py", "**/*.json", "**/*.txt"]
mode_project = ["test/**/*.py", "test/**/*.sh", "test/**/*.txt", "requirements.txt"]
